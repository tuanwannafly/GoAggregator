name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Test
        run: go test -cover ./...

      - name: Build API
        run: go build ./cmd/api

      - name: Build mock provider
        run: go build ./cmd/mockprovider

      - name: Build Docker image
        run: docker build --build-arg APP=api -t goaggregator-api:ci .

      - name: Validate Compose config
        run: docker compose config
